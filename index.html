<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bluetooth Command Test</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <p class="eyebrow">Safari / iOSWebBLE / Bluefy</p>
        <h1>Bluetooth Command Test</h1>
        <p class="lead">
          Safari拡張でBluetoothが使えるか、文字起こしと同時に使えるかを確認するテストページです。
        </p>

        <div id="supportStatus" class="status warn">確認中</div>

        <div class="support-grid">
          <div>
            <span>navigator.bluetooth</span>
            <strong id="bluetoothApiStatus">確認中</strong>
          </div>
          <div>
            <span>navigator.webble</span>
            <strong id="webbleApiStatus">確認中</strong>
          </div>
          <div>
            <span>音声認識</span>
            <strong id="speechApiStatus">確認中</strong>
          </div>
          <div>
            <span>マイク</span>
            <strong id="micApiStatus">未確認</strong>
          </div>
        </div>

        <div class="actions">
          <button id="checkMicButton" type="button">マイク確認</button>
          <button id="speechButton" type="button">文字起こし確認</button>
        </div>
        <textarea id="speechText" readonly placeholder="文字起こし結果がここに表示されます"></textarea>

        <div class="grid">
          <label>
            <span>デバイス名フィルタ</span>
            <input id="deviceName" type="text" value="ESP32" placeholder="例: ESP32" />
          </label>

          <label>
            <span>Service UUID</span>
            <input id="serviceUuid" type="text" value="6e400001-b5a3-f393-e0a9-e50e24dcca9e" />
          </label>

          <label>
            <span>TX Characteristic UUID</span>
            <input id="characteristicUuid" type="text" value="6e400002-b5a3-f393-e0a9-e50e24dcca9e" />
          </label>
        </div>

        <div class="actions">
          <button id="connectButton" type="button">接続</button>
          <button id="disconnectButton" type="button" disabled>切断</button>
        </div>
      </section>

      <section class="panel">
        <h2>コマンド送信</h2>
        <div class="command-grid">
          <button data-command="FORWARD" type="button" disabled>FORWARD</button>
          <button data-command="LEFT" type="button" disabled>LEFT</button>
          <button data-command="RIGHT" type="button" disabled>RIGHT</button>
          <button data-command="BACK" type="button" disabled>BACK</button>
          <button data-command="STOP" type="button" disabled>STOP</button>
          <button data-command="BARK" type="button" disabled>BARK</button>
        </div>

        <form id="customCommandForm" class="custom">
          <label>
            <span>任意コマンド</span>
            <input id="customCommand" type="text" value="HELLO" />
          </label>
          <button id="sendCustomButton" type="submit" disabled>送信</button>
        </form>
      </section>

      <section class="panel">
        <h2>ログ</h2>
        <pre id="log"></pre>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
